<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <style>
    .bg { fill: #10b981; }
    .text { 
      fill: #ffffff; 
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; 
      text-anchor: middle;
    }
    .ip { font-size: 320px; font-weight: 900; letter-spacing: -10px; }
    .s { font-size: 250px; font-weight: 800; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #059669; }
    }
  </style>
  <rect class="bg" width="512" height="512" rx="112" />
  <text x="250" y="365" class="text">
    <tspan class="ip">IP</tspan><tspan class="s">s</tspan>
  </text>
</svg>
